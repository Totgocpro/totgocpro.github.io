<header class="topbar" id="topbar">
  <div class="topbar-inner">
    <a class="brand" href="{{ '/' | relative_url }}" aria-label="Tototcs ; home">
      <img class="brand-avatar" src="{{ '/profil.jpeg' | relative_url }}" alt="" width="32" height="32">
      <span class="brand-name">Tototcs<span class="brand-dot">.</span></span>
    </a>

    <nav class="nav" id="site-nav" aria-label="Main navigation">
      <a class="nav-link{% if page.url == '/' %} active{% endif %}" href="{{ '/' | relative_url }}">Home</a>
      <a class="nav-link{% if page.url contains '/blog' %} active{% endif %}" href="{{ '/blog/' | relative_url }}">Blog</a>
      <a class="nav-link" href="{{ '/' | relative_url }}#projects">Projects</a>
      <a class="nav-link" href="{{ '/' | relative_url }}#timeline">Timeline</a>
      <a class="nav-link" href="{{ '/' | relative_url }}#contact">Contact</a>
    </nav>

    <div class="topbar-actions">
      <button class="icon-btn" id="theme-toggle" type="button" aria-label="Switch to light theme" title="Toggle theme">
        <i class="fas fa-moon" aria-hidden="true"></i>
      </button>
      <a class="btn btn-primary btn-sm topbar-github" href="https://github.com/Totgocpro" target="_blank" rel="noopener noreferrer">
        <i class="fab fa-github" aria-hidden="true"></i>
        <span>GitHub</span>
      </a>
      <button class="icon-btn nav-toggle" id="nav-toggle" type="button" aria-label="Open menu" aria-expanded="false" aria-controls="site-nav">
        <i class="fas fa-bars" aria-hidden="true"></i>
      </button>
    </div>
  </div>
</header>
